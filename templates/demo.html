<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeJet Demo</title>

    <style>
        body {
            margin: 0;
            background: #000;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background: #000;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>

<body>

<div class="video-container">
    <iframe
        id="stream-player"
        src="https://customer-0k2chsytrbkmpgjr.cloudflarestream.com/38ccab99e8156adae4abcfbb1d36cc0f/iframe?poster=https%3A%2F%2Fcustomer-0k2chsytrbkmpgjr.cloudflarestream.com%2F38ccab99e8156adae4abcfbb1d36cc0f%2Fthumbnails%2Fthumbnail.jpg%3Ftime%3D%26height%3D600"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
        allowfullscreen>
    </iframe>
</div>

<script src="https://embed.cloudflarestream.com/embed/sdk.latest.js"></script>

<script>
    const player = Stream(
        document.getElementById('stream-player')
    );

    player.addEventListener('ended', () => {
        setTimeout(() => {
            window.location.href = 'https://codejet.app/';
        }, 1000);
    });
</script>

</body>
</html>
