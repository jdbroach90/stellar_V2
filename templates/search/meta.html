<title>{{ seo.title }}</title>
<meta name="description" content="{{ seo.description }}">
<link rel="canonical" href="{{ seo.canonical }}">
<meta name="robots" content="{% if seo.indexable %}index, follow, max-image-preview:large, max-video-preview:-1{% else %}noindex, nofollow{% endif %}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="CodeJet">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:url" content="{{ seo.canonical }}">
<meta property="og:image" content="{{ seo.image }}">
<meta property="og:image:alt" content="{{ seo.image_alt }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo.title }}">
<meta name="twitter:description" content="{{ seo.description }}">
<meta name="twitter:image" content="{{ seo.image }}">
{% if seo.verification %}<meta name="google-site-verification" content="{{ seo.verification }}">{% endif %}
<script type="application/ld+json">{{ seo.structured_data|tojson }}</script>
